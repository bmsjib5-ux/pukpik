name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละงาน ไม่ยกเลิกงานที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ครั้งแรกต้องไปตั้ง Settings → Pages → Source: GitHub Actions ด้วยตัวเองก่อน
      # (GITHUB_TOKEN ไม่มีสิทธิ์ admin พอที่จะสร้าง Pages site ให้เอง)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # เผยแพร่เฉพาะไฟล์เกม ไม่ต้องเอา README / render.yaml / .github ขึ้นเว็บด้วย
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
